[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — handled by formatter
    "F401",   # unused import — common in __init__ re-exports
]
exclude = ["ml/notebooks/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
