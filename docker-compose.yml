# ============================================================
# Olist Data Lakehouse Platform – Docker Compose
# ============================================================
# Quick start:
#   cp .env.example .env       # fill in R2 credentials
#   docker compose up -d       # core stack (streaming + lakehouse + orchestration + ml)
#
# Optional profiles:
#   --profile spark            Spark cluster (distributed processing)
#   --profile query            Trino (query federation)
#   --profile bi               Streamlit BI app
#   --profile coder            Coder cloud IDE (accessible from any network via Cloudflare Tunnel)
#
# Full stack:
#   docker compose --profile spark --profile query --profile bi up -d
#
# Coder (team remote dev env):
#   docker compose --profile coder up -d
#   See CODER_SETUP.md for Cloudflare Tunnel setup
#
# Storage: Cloudflare R2 – set S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY in .env
# Bucket "olist-lakehouse" must be pre-created in the Cloudflare dashboard.
# ============================================================

name: olist-lakehouse

networks:
  lakehouse:
    driver: bridge
    enable_ipv6: false

volumes:
  postgres_data:
  redpanda_data:
  prefect_home:
  spark_logs:
  coder_data:

x-spark-env: &spark-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  # R2 endpoint – dùng bởi Spark S3A + Iceberg S3FileIO
  SPARK_HADOOP_FS_S3A_ENDPOINT: ${S3_ENDPOINT}
  SPARK_SQL_CATALOG_OLIST_S3_ENDPOINT: ${S3_ENDPOINT}

services:

  # ──────────────────────────────────────────────────────────
  # INFRASTRUCTURE – PostgreSQL
  # Backs: Iceberg catalog · Prefect metadata · MLflow tracking
  # ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: olist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olistpass}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # ICEBERG REST CATALOG
  # Backend: PostgreSQL JDBC  |  Storage: Cloudflare R2
  # API: http://localhost:8181
  # ──────────────────────────────────────────────────────────

  iceberg-rest:
    image: tabulario/iceberg-rest:0.10.0
    container_name: olist-iceberg-rest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg
      CATALOG_JDBC_USER: olist
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-olistpass}
      CATALOG_JDBC_INITIALIZE__SCHEMA: "true"
      CATALOG_WAREHOUSE: s3://retail-data-lake
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${S3_ENDPOINT}
      CATALOG_S3_PATH__STYLE__ACCESS: ${S3_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION:-auto}
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8181'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # STREAMING – REDPANDA
  # Kafka-compatible broker (no JVM/Zookeeper)
  # External Kafka addr: localhost:19092
  # Internal Kafka addr: redpanda:9092
  # Console UI:          http://localhost:8080
  # ──────────────────────────────────────────────────────────

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.18
    container_name: olist-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --default-log-level=warn
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "18081:18081"   # Schema Registry (host)
      - "18082:18082"   # HTTP Proxy (host)
      - "19092:19092"   # Kafka API (host)
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy|healthy' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - lakehouse

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.6
    container_name: olist-redpanda-console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"   # Redpanda Console  →  http://localhost:8080
    networks:
      - lakehouse

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.18
    container_name: olist-redpanda-init
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: |
      /bin/bash -c "
        rpk -X brokers=redpanda:9092 topic create olist.orders   --partitions 3 --replicas 1 || true
        rpk -X brokers=redpanda:9092 topic create olist.reviews  --partitions 3 --replicas 1 || true
        rpk -X brokers=redpanda:9092 topic create olist.payments --partitions 3 --replicas 1 || true
        rpk -X brokers=redpanda:9092 topic create olist.leads    --partitions 2 --replicas 1 || true
        rpk -X brokers=redpanda:9092 topic create olist.deals    --partitions 2 --replicas 1 || true
        echo '=== Redpanda topics ready ==='
        rpk -X brokers=redpanda:9092 topic list
      "
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # DISTRIBUTED PROCESSING – APACHE SPARK
  # Profile: --profile spark
  # Master UI:  http://localhost:8090
  # Worker UI:  http://localhost:8091
  # ──────────────────────────────────────────────────────────

  spark-master:
    image: apache/spark:3.5.0
    container_name: olist-spark-master
    restart: unless-stopped
    profiles: ["spark"]
    entrypoint: ["/opt/spark/sbin/start-master.sh"]
    environment:
      <<: *spark-env
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8090
    volumes:
      - ./spark/jobs:/opt/spark/jobs:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/jars:/opt/spark/jars:ro
      - spark_logs:/opt/spark/logs
    ports:
      - "7077:7077"   # Spark master RPC
      - "8090:8090"   # Spark master UI  →  http://localhost:8090
    networks:
      - lakehouse

  spark-worker:
    image: apache/spark:3.5.0
    container_name: olist-spark-worker
    restart: unless-stopped
    profiles: ["spark"]
    depends_on:
      - spark-master
    entrypoint: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2G}
    volumes:
      - ./spark/jobs:/opt/spark/jobs:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/jars:/opt/spark/jars:ro
      - spark_logs:/opt/spark/logs
    ports:
      - "8091:8081"   # Spark worker UI  →  http://localhost:8091
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # QUERY FEDERATION – TRINO
  # Profile: --profile query
  # UI + REST: http://localhost:8082
  # Catalogs: iceberg (Bronze/Silver/Gold) · postgres (external)
  # ──────────────────────────────────────────────────────────

  trino:
    image: trinodb/trino:435
    container_name: olist-trino
    restart: unless-stopped
    profiles: ["query"]
    depends_on:
      iceberg-rest:
        condition: service_healthy
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-auto}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olistpass}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
    ports:
      - "8082:8080"   # Trino UI  →  http://localhost:8082
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # ORCHESTRATION – PREFECT
  # Server UI:  http://localhost:4200
  # Worker runs flows from ./prefect/flows/
  # Note: prefect-worker uses a custom image (see prefect/Dockerfile)
  # ──────────────────────────────────────────────────────────

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: olist-prefect-server
    restart: unless-stopped
    command: prefect server start
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: 4200
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://olist:${POSTGRES_PASSWORD:-olistpass}@postgres:5432/prefect
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4200/api}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4200:4200"   # Prefect UI  →  http://localhost:4200
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\" 2>/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - lakehouse

  prefect-worker:
    build:
      context: .
      dockerfile: prefect/Dockerfile
    container_name: olist-prefect-worker
    restart: unless-stopped
    command: prefect worker start --pool default-process-pool
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_HOME: /prefect
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-auto}
      ICEBERG_REST_URI: ${ICEBERG_REST_URI:-http://iceberg-rest:8181}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-auto}
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      # Spark: local[2] mặc định; đổi thành spark://spark-master:7077 khi dùng cluster
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}
      SPARK_JARS_DIR: /app/spark-jars
      # OpenLineage → Marquez (chỉ active khi --profile lineage; Spark tự skip nếu Marquez offline)
      OPENLINEAGE_URL: http://marquez:5002
    depends_on:
      prefect-server:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    volumes:
      - ./ingestion:/app/ingestion:ro
      - ./spark/jobs:/app/spark/jobs:ro
      - ./spark/jars:/app/spark-jars:ro
      - ./prefect/flows:/app/flows:ro
      - ./quality:/app/quality:ro
      - ./streaming:/app/streaming:ro
      - ./data:/app/data:ro
      - ./ml:/app/ml:ro
      - prefect_home:/prefect
    working_dir: /app
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # ML LIFECYCLE – MLFLOW
  # UI + REST: http://localhost:5000
  # Artifacts stored in s3://olist-lakehouse/mlflow
  # ──────────────────────────────────────────────────────────

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: olist-mlflow
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install -q psycopg2-binary
        exec mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri postgresql://olist:${POSTGRES_PASSWORD:-olistpass}@postgres:5432/mlflow \
          --default-artifact-root s3://retail-data-lake/mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-auto}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"   # MLflow UI  →  http://localhost:5000
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" 2>/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # ML SERVING – FastAPI (3 XGBoost models)
  # Loads models from MLflow Registry on startup
  # API docs: http://localhost:8080/docs
  # Endpoints: /predict/delivery-delay  /predict/churn  /predict/lead
  # ──────────────────────────────────────────────────────────

  ml-serving:
    build:
      context: ./ml/serving
      dockerfile: Dockerfile
    container_name: olist-ml-serving
    restart: unless-stopped
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: ${S3_ENDPOINT}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-auto}
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "8080:8080"   # ML Serving API  →  http://localhost:8080/docs
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # BI – STREAMLIT (Agentic BI + real-time dashboard)
  # Profile: --profile bi
  # App: http://localhost:8501
  # ──────────────────────────────────────────────────────────

  streamlit:
    build:
      context: ./bi
      dockerfile: Dockerfile
    container_name: olist-streamlit
    restart: unless-stopped
    profiles: ["bi"]
    command: >
      streamlit run agentic_bi.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.enableCORS=false
      --server.enableXsrfProtection=false
      --server.headless=true
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      ICEBERG_REST_URI: ${ICEBERG_REST_URI:-http://iceberg-rest:8181}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      REDPANDA_BROKERS: redpanda:9092
      REFRESH_INTERVAL: "3"
    depends_on:
      mlflow:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
    ports:
      - "8501:8501"   # Streamlit  →  http://localhost:8501
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # CLOUD IDE – CODER
  # Profile: --profile coder
  # Local UI:   http://localhost:7080
  # Team URL:   ${CODER_ACCESS_URL}  (via Cloudflare Tunnel)
  # Docs:       CODER_SETUP.md
  #
  # Coder tạo workspace containers trên Docker host.
  # Mỗi thành viên có workspace riêng, cài sẵn Python/PySpark/Prefect.
  # ──────────────────────────────────────────────────────────

  coder:
    image: ghcr.io/coder/coder:latest
    container_name: olist-coder
    restart: unless-stopped
    profiles: ["coder"]
    user: "0"   # root required to create workspace containers via Docker socket
    environment:
      CODER_PG_CONNECTION_URL: "postgresql://olist:${POSTGRES_PASSWORD:-olistpass}@postgres:5432/coder?sslmode=disable"
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-http://localhost:7080}
      CODER_WILDCARD_ACCESS_URL: ${CODER_WILDCARD_ACCESS_URL:-}
      CODER_HTTP_ADDRESS: "0.0.0.0:7080"
      CODER_TELEMETRY_ENABLE: "false"
      CODER_DISABLE_PASSWORD_AUTH: "false"
      CODER_FIRST_USER_EMAIL: ${CODER_FIRST_USER_EMAIL}
      CODER_FIRST_USER_PASSWORD: ${CODER_FIRST_USER_PASSWORD}
      CODER_FIRST_USER_USERNAME: ${CODER_FIRST_USER_USERNAME}
      # Pass lakehouse credentials so workspace templates can inherit them
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - coder_data:/home/coder/.config
    ports:
      - "7080:7080"   # Coder UI  →  http://localhost:7080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lakehouse

  coder-init:
    image: ghcr.io/coder/coder:latest
    container_name: olist-coder-init
    restart: "no"
    profiles: ["coder"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '%s\n%s\n' "$$CODER_FIRST_USER_PASSWORD" "$$CODER_FIRST_USER_PASSWORD" | \
        coder reset-password "$$CODER_FIRST_USER_USERNAME" \
          --postgres-url "postgresql://olist:$$POSTGRES_PASSWORD@postgres:5432/coder?sslmode=disable"
    environment:
      CODER_FIRST_USER_USERNAME: ${CODER_FIRST_USER_USERNAME}
      CODER_FIRST_USER_PASSWORD: ${CODER_FIRST_USER_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olistpass}
    depends_on:
      coder:
        condition: service_healthy
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # NGROK TUNNEL – truy cập Coder từ mọi mạng (URL cố định)
  # Profile: --profile coder
  # Static domain: ${NGROK_STATIC_DOMAIN}
  # Lấy token + domain tại: https://dashboard.ngrok.com
  # ──────────────────────────────────────────────────────────

  ngrok:
    image: ngrok/ngrok:latest
    container_name: olist-ngrok
    restart: unless-stopped
    profiles: ["coder"]
    command: http coder:7080 --domain=${NGROK_STATIC_DOMAIN} --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      coder:
        condition: service_healthy
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # DATA LINEAGE – MARQUEZ (OpenLineage reference implementation)
  # Profile: --profile lineage
  # API:  http://localhost:5002
  # Web:  http://localhost:3000
  # Tracks Bronze → Silver → Gold lineage emitted by Spark jobs
  # ──────────────────────────────────────────────────────────

  marquez:
    image: marquezproject/marquez:latest
    container_name: olist-marquez
    restart: unless-stopped
    profiles: ["lineage"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olistpass}
      MARQUEZ_CONFIG: marquez.yml
    volumes:
      - ./infra/marquez/marquez.yml:/usr/src/app/marquez.yml:ro
    ports:
      - "5002:5002"   # Marquez API
      - "5003:5003"   # Marquez admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5003/healthcheck | grep -q '\"healthy\":true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - lakehouse

  marquez-web:
    image: marquezproject/marquez-web:latest
    container_name: olist-marquez-web
    restart: unless-stopped
    profiles: ["lineage"]
    depends_on:
      - marquez
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5002
      WEB_PORT: 3000
    ports:
      - "3000:3000"   # Marquez UI  →  http://localhost:3000
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # URL REPORTER – tự fetch trycloudflare URLs khi cf-* restart
  # Xem URLs: cat tunnel-urls.txt  |  docker logs olist-url-reporter
  # ──────────────────────────────────────────────────────────
  url-reporter:
    image: docker:27-cli
    container_name: olist-url-reporter
    restart: unless-stopped
    depends_on:
      cf-prefect:
        condition: service_started
      cf-mlflow:
        condition: service_started
      cf-redpanda:
        condition: service_started
      cf-ml-serving:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olistpass}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/tunnel_urls.sh:/tunnel_urls.sh:ro
      - ./tunnel-urls.txt:/tunnel-urls.txt
      - ./.env:/project.env
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache postgresql-client -q && /bin/sh /tunnel_urls.sh"]
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # CLOUDFLARE QUICK TUNNELS – trycloudflare.com (no domain needed)
  # URL thay đổi mỗi lần restart → xem URL: cat tunnel-urls.txt
  # ──────────────────────────────────────────────────────────
  cf-prefect:
    image: cloudflare/cloudflared:latest
    container_name: olist-cf-prefect
    restart: unless-stopped
    command: tunnel --url http://prefect-server:4200
    depends_on:
      prefect-server:
        condition: service_healthy
    networks:
      - lakehouse

  cf-mlflow:
    image: cloudflare/cloudflared:latest
    container_name: olist-cf-mlflow
    restart: unless-stopped
    command: tunnel --url http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - lakehouse

  cf-redpanda:
    image: cloudflare/cloudflared:latest
    container_name: olist-cf-redpanda
    restart: unless-stopped
    command: tunnel --url http://redpanda-console:8080
    depends_on:
      - redpanda-console
    networks:
      - lakehouse

  cf-iceberg:
    image: cloudflare/cloudflared:latest
    container_name: olist-cf-iceberg
    restart: unless-stopped
    command: tunnel --url http://iceberg-rest:8181
    depends_on:
      iceberg-rest:
        condition: service_healthy
    networks:
      - lakehouse

  cf-streamlit:
    image: cloudflare/cloudflared:latest
    container_name: olist-cf-streamlit
    restart: unless-stopped
    profiles: ["bi"]
    command: tunnel --url http://streamlit:8501
    depends_on:
      - streamlit
    networks:
      - lakehouse

  cf-ml-serving:
    image: cloudflare/cloudflared:latest
    container_name: olist-cf-ml-serving
    restart: unless-stopped
    command: tunnel --url http://ml-serving:8080
    depends_on:
      ml-serving:
        condition: service_healthy
    networks:
      - lakehouse

  # ──────────────────────────────────────────────────────────
  # R2 BROWSER – Filestash
  # Profile: --profile query
  # UI: http://localhost:8484
  # Browse Bronze / Silver / Gold files trực tiếp
  # ──────────────────────────────────────────────────────────

  filestash:
    image: machines/filestash:latest
    container_name: olist-filestash
    restart: unless-stopped
    profiles: ["query"]
    ports:
      - "8484:8334"
    networks:
      - lakehouse
