# Trino Iceberg catalog — backed by Iceberg REST + MinIO/R2
# Covers all medallion layers: bronze.*, silver.*, gold.*

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181

iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# Native S3 file system (Trino 435+)
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.path-style-access=${ENV:S3_PATH_STYLE}
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
s3.region=${ENV:S3_REGION}
