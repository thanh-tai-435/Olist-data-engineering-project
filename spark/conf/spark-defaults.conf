# ============================================================
# Spark defaults — Iceberg + Cloudflare R2 integration
# JARs must be present in ./spark/jars/ before starting.
# Download script: see spark/jars/README.md
#
# NOTE: S3 credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
#       được inject qua docker-compose environment (x-spark-env).
#       S3_ENDPOINT được set trong environment của spark containers.
#       PySpark jobs (silver/gold_transform.py) tự config SparkSession
#       từ env vars → file này chỉ dùng khi chạy spark-submit trực tiếp.
# ============================================================

# Iceberg Spark runtime (matches Spark 3.5 / Scala 2.12)
spark.jars                                      /opt/bitnami/spark/jars/iceberg-spark-runtime-3.5_2.12-1.5.0.jar,/opt/bitnami/spark/jars/hadoop-aws-3.3.4.jar,/opt/bitnami/spark/jars/aws-java-sdk-bundle-1.12.262.jar

# Iceberg extensions
spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Iceberg REST catalog (named "olist")
spark.sql.catalog.olist                         org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.olist.type                    rest
spark.sql.catalog.olist.uri                     http://iceberg-rest:8181
spark.sql.catalog.olist.warehouse               s3://retail-data-lake
spark.sql.catalog.olist.io-impl                 org.apache.iceberg.aws.s3.S3FileIO
# R2 không dùng path-style access (khác MinIO)
spark.sql.catalog.olist.s3.path-style-access    false

# Hadoop S3A
spark.hadoop.fs.s3a.path.style.access          false
spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider    org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
spark.hadoop.fs.s3a.connection.ssl.enabled      true

# Tune cho dataset nhỏ (~200 MB)
spark.sql.shuffle.partitions                    8
spark.default.parallelism                       4
